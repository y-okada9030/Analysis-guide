site_name: 広がったX線源の解析ガイド
site_description: Chandra と XRISM の extended source 解析を学ぶ日本語ガイド
site_url: https://y-okada9030.github.io/Analysis-guide/
theme:
  name: material
  language: ja
  features:
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
nav:
  - このガイドについて: index.md
  - 解析を始める前に: preparation.md
  - 共通のデータ形式:
      - FITS ファイルとヘッダー: fits.md
  - Chandra/ACIS:
      - 広がった線源: chandra.md
      - DS9 画像解析: ds9.md
      - DS9 画像解析でよくある間違い: ds9-common-mistakes.md
  - XRISM/Resolve・Xtend: xrism.md
  - スペクトル解析と結果の確認: spectra.md
  - 対象外の解析と今後の追加: other-analyses.md
  - 公式資料: references.md
