site_name: 広がったX線源の解析ガイド
site_description: Chandra と XRISM の extended source 解析を学ぶ日本語ガイド
site_url: https://y-okada9030.github.io/Analysis-guide/
theme:
  name: material
  language: ja
  features:
    - content.code.copy
    - search.highlight
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true
exclude_docs: |
  /getting-started/
  /common/
  /missions/
  /appendices/
nav:
  - このガイドについて: index.md
  - 解析を始める前に: preparation.md
  - Chandra/ACIS: chandra.md
  - XRISM/Resolve・Xtend: xrism.md
  - スペクトル解析と結果の確認: spectra.md
  - 対象外の解析と今後の追加: other-analyses.md
  - 公式資料: references.md
